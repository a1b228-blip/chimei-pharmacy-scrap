        Height: =30
        Size: =13
        Text: ="⚠️ 警告：抗生素或藥品單次報廢超過 50 顆/支，依院內規定須提報藥劑科主任專案複核！"
        Visible: =Value(QtyInput.Text) > 50
        Width: =1000
        X: =CardContainer.X + 30
        Y: =CardContainer.Y + 410
        ZIndex: =23

    SubmitButton As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 90, 158, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =48
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: |-
            =If(
                IsBlank(WardCombo.Selected.Value) || IsBlank(DrugNameCombo.Selected.Value) || IsBlank(QtyInput.Text),
                Notify("請完整填寫所有必填欄位 (病房、藥名、數量)！", NotificationType.Error),
                Notify(
                    "抗生素報廢單提交成功！" & If(Value(QtyInput.Text) > 50, " (報廢數量大於 50 顆，已啟動主任專案審核推播)", " (正常流程)"),
                    NotificationType.Success
                )
            )
