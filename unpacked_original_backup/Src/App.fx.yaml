App As appinfo:
    BackEnabled: =true
    OnStart: |-
        =Concurrent(
            ClearCollect(colBatch1, Filter('藥品主檔', ID <= 2000)),
            ClearCollect(colBatch2, Filter('藥品主檔', ID > 2000))
        );
        ClearCollect(colDrugMaster, colBatch1, colBatch2)
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false

